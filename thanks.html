<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            --bg: #f4f1ea;
            --surface: #ffffff;
            --ink: #141414;
            --muted: #5e5e5e;
            --accent: #1e3a2b;
            --border: #141414;
            --radius: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 560px;
            width: 100%;
            background: var(--surface);
            padding: 40px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 6px 6px 0px var(--border);
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--muted);
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #ffffff;
            padding: 12px 24px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 800;
            box-shadow: 3px 3px 0px var(--border);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thank You!</h1>
        <p>Your message has been successfully sent. We have received your request and will get back to you shortly with an estimate for your junk removal.</p>
        <a href="/" class="btn">Return to Home</a>
    </div>

</body>
